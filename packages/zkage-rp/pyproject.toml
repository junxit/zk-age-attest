[project]
name = "zkage-rp"
version = "0.1.0"
description = "zk-age-attest demo relying party: challenge issuance and pop-before-verify redemption"
requires-python = ">=3.12"
dependencies = [
    "zkage-core",
    "zkage-verifier",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv.sources]
zkage-core = { workspace = true }
zkage-verifier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
