[project]
name = "zkage-workspace"
version = "0.1.0"
description = "Auditably privacy-preserving age verification (RFC 9474 blind signatures) — workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "mypy>=1.14",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["zkage_core", "zkage_verifier", "zkage_issuer", "zkage_rp", "zkage_ua"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-q"

[tool.mypy]
files = [
    "packages/zkage-core/src",
    "packages/zkage-verifier/src",
]
mypy_path = [
    "packages/zkage-core/src",
    "packages/zkage-verifier/src",
]
explicit_package_bases = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
