[project]
name = "zkage-threshold"
version = "0.1.0"
description = "EXPERIMENTAL 2-of-3 threshold RSA blind-signing starter for zk-age-attest (v1.5, wire-compatible with zkage-core)"
requires-python = ">=3.12"
dependencies = ["zkage-core"]

[tool.uv.sources]
zkage-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
